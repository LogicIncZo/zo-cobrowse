<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<title>Zo Co-browse</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1280px;height:720px;overflow:hidden}
  body{background:#141225;color:#f4f1ea;font-family:-apple-system,'Segoe UI',Roboto,sans-serif;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px}
  .peg{font-size:64px;color:#e8b04b;letter-spacing:6px}
  h1{font-size:52px;font-weight:800}
  h1 .zo{color:#e8b04b}
  .tag{font-size:20px;color:#b9b3a5}
  .repo{margin-top:14px;font-family:ui-monospace,Menlo,monospace;font-size:21px;background:rgba(255,255,255,.07);
    border:1px solid rgba(255,255,255,.15);border-radius:12px;padding:12px 26px;color:#e8b04b}
  .badges{display:flex;gap:14px;font-size:14px;color:#8a8273}
  .badges span{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:999px;padding:5px 14px}
</style>
</head>
<body>
  <div class="peg">⢕⣿</div>
  <h1><span class="zo">Zo</span> Co-browse</h1>
  <div class="tag">AI that sees your page, understands context, and acts through your browser.</div>
  <div class="repo">github.com/LogicIncZo/zo-cobrowse</div>
  <div class="badges"><span>MIT licensed</span><span>Chrome MV3</span><span>Open source</span></div>
</body>
</html>
