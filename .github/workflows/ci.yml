name: CI

# Runs on every branch push (so active work branches like `Rewritet` get
# the same gate), plus PRs into `main` and manual runs. Release creation is
# handled by a separate tag-triggered workflow (see .github/workflows/release.yml).

on:
  push:
  pull_request:
    # CI gates every promotion edge in the git-flow model:
    # feature/* -> dev (integration) and dev -> main (release-stable).
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run tests with coverage
        run: bun test tests/ --coverage --coverage-reporter=text --coverage-reporter=lcov

      - name: Upload coverage (lcov)
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          retention-days: 14
          if-no-files-found: error

      - name: Transpile check (every extension entry point)
        run: |
          for f in extension/*.js; do
            bun build "$f" --outdir /tmp/zo-build-check >/dev/null || { echo "TRANSPILE FAIL: $f"; exit 1; }
            echo "OK: $f"
          done

      - name: Validate contract schemas present
        run: |
          for s in config manifest messages actions bang-commands; do
            test -f "tests/schemas/$s.ts" && echo "schema OK: $s.ts" || { echo "MISSING schema: $s.ts"; exit 1; }
          done

  e2e:
    # Real-Chromium suite — the expensive job (~2min just to fetch the
    # browser), so it is NOT run on plain feature-branch pushes: those
    # branches gate through their PR into dev (same suite, merge ref), and
    # the duplicate push-event run only queues behind the PR run. Runs on
    # PRs into main/dev, pushes to the protected branches, and adhoc via
    # workflow_dispatch.
    if: github.event_name != 'push' || github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        run: bun install

      # Browser binaries are ~170MB per download — cache them keyed on the
      # lockfile (a Playwright version bump misses and re-downloads; apt deps
      # still install via --with-deps, which no-ops the download on a hit).
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('bun.lock') }}
          restore-keys: playwright-chromium-

      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium

      - name: Run e2e tests (real Chromium + mock Zo API)
        run: bun run test:e2e

      - name: Upload e2e report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: e2e/report/
          retention-days: 7

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run release checks
        run: bun run lint

  drift:
    # Zo API drift gate (2026-08-28): diffs the two upstream reference
    # snapshots — EthanThatOneKid/zocomputer-tools mcp-tools.json (Zo's MCP
    # tool inventory) and EthanThatOneKid/zocomputer-ts openapi.json (Zo's
    # REST surface), both auto-refreshed nightly from Zo's live servers —
    # against the pinned baselines in scripts/zo-drift/baseline/. Gates
    # dev→main (release) merges: soft drift stays green but files a
    # `zo-api-drift` ticket; hard drift (a load-bearing dependency changed:
    # /zo/ask fields, catalog vision field, endpoints, or the `bash` MCP
    # tool) goes red. Tickets dedup on a stable key embedded in the issue
    # body; triage, then `bun run check:drift --update-baseline` and commit
    # the refreshed baselines referencing the ticket.
    if: >-
      github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main') || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Run drift check (upstream references vs pinned baselines)
        id: drift
        continue-on-error: true
        run: bun scripts/zo-drift/check.ts --report-json > drift-report.json

      - name: File dev tickets for drift findings
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -f drift-report.json ]; then echo "no report — checker crashed before writing one (see step above)"; exit 0; fi
          COUNT=$(jq '.findings | length' drift-report.json)
          if [ "$COUNT" -eq 0 ]; then echo "no drift — nothing to file"; exit 0; fi
          echo "$COUNT finding(s) — filing tickets for new ones"
          gh label create zo-api-drift --color D93F0B --description "Upstream Zo API/reference drift detected by the release gate" 2>/dev/null || true
          jq -c '.findings[]' drift-report.json | while read -r finding; do
            KEY=$(printf '%s' "$finding" | jq -r .key)
            if gh issue list --label zo-api-drift --state open --json body --jq '.[].body' | grep -qF "zo-drift:key=$KEY"; then
              echo "skip — an open ticket already covers $KEY"
              continue
            fi
            TITLE=$(printf '%s' "$finding" | jq -r .title)
            printf '%s' "$finding" | jq -r '"## " + .title, "", "**Severity:** " + .severity + " — detected by the Zo API drift gate.", "", .details, "", "Triage: audit the change, fix or accept it, then re-pin the baselines with `bun run check:drift --update-baseline` (run from the repo root) and commit them referencing this issue.", "", "<!-- zo-drift:key=" + .key + " -->"' > ticket-body.md
            gh issue create --label zo-api-drift --title "[zo-drift] $TITLE" --body-file ticket-body.md
          done

      - name: Gate — fail on hard drift or infra failure
        if: always()
        run: |
          if [ ! -f drift-report.json ]; then
            echo "::error::drift checker produced no report — infra failure (see the check step log)"
            exit 1
          fi
          if jq -e '.error' drift-report.json > /dev/null; then
            echo "::error::drift check infra failure: $(jq -r .error drift-report.json)"
            exit 1
          fi
          HARD=$(jq '[.findings[] | select(.severity == "hard")] | length' drift-report.json)
          if [ "$HARD" -gt 0 ]; then
            echo "::error::hard Zo API drift — $HARD load-bearing dependency change(s). Triage the filed zo-api-drift ticket(s), then re-pin the baselines (bun run check:drift --update-baseline). Admin-bypass only if the release must ship regardless."
            exit 1
          fi
          echo "gate passed — no hard drift"

  package:
    needs: [test, lint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Create extension package
        run: |
          mkdir -p dist
          cp -r extension dist/zo-cobrowse
          cd dist && zip -r ../zo-cobrowse.zip zo-cobrowse/

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: zo-cobrowse-extension
          path: zo-cobrowse.zip
          if-no-files-found: error
